version: '3.8'

services:
  goruslugimsk:
    image: thegusev/sanit-solutions:latest
    # Для локальной сборки раскомментировать:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: goruslugimsk
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  push-server:
    image: node:20-alpine
    container_name: push-server
    working_dir: /app
    command: sh -c "npm i && node push-server.js"
    volumes:
      - ./push-server.js:/app/push-server.js
      - ./push-server-package.json:/app/package.json
      - push-data:/data
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}

volumes:
  push-data:
