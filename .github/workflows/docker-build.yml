name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  IMAGE_NAME: thegusev/sanit-solutions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install moreutils (for `ts` timestamping)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq moreutils

      - name: Pre-build diagnostics
        run: |
          echo "=== Runner snapshot $(date -u) ==="
          uname -a
          docker version
          echo "--- Disk ---"
          df -h
          echo "--- Memory ---"
          free -m
          echo "--- Build context size ---"
          du -sh . --exclude=.git 2>/dev/null | tail -1
          echo "--- Top 15 largest dirs in context ---"
          du -sh */ 2>/dev/null | sort -rh | head -15
          echo "--- .dockerignore ---"
          cat .dockerignore || echo "(no .dockerignore)"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Native docker build with plain progress so each RUN/COPY step
      # streams to the log in real time (not collapsed). Every line is
      # timestamped via `ts` so we can measure where time is spent.
      - name: Build image (verbose, timestamped)
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: plain
        run: |
          set -o pipefail
          START=$(date +%s)
          echo "=== docker build start $(date -u) ==="
          docker build \
            --progress=plain \
            --build-arg CACHEBUST=${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            . 2>&1 | ts '[%H:%M:%S]'
          EXIT=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "=== docker build finished: exit=$EXIT, duration=$((END-START))s ==="
          if [ $EXIT -ne 0 ]; then exit $EXIT; fi
          docker images ${{ env.IMAGE_NAME }}

      - name: Post-build diagnostics
        if: always()
        run: |
          echo "=== Post-build snapshot $(date -u) ==="
          df -h
          docker system df || true
          docker images ${{ env.IMAGE_NAME }} || true

      - name: Smoke check SSG coverage
        run: |
          echo "=== smoke check start $(date -u) ==="
          docker run --rm \
            --entrypoint sh \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -c '
              set -e
              echo "=== SSG Artifact Verification ==="
              SSG_COUNT=$(find /usr/share/nginx/html -name "index.html" | wc -l)
              echo "Total pages: $SSG_COUNT"
              FAIL=0
              for f in \
                uslugi/dezinsekciya/klopy/index.html \
                uslugi/dezinsekciya/blohi/index.html \
                uslugi/deratizaciya/krysy/index.html \
                uslugi/dezinfekciya/kvartir/index.html \
                rajony/arbat/index.html \
                moscow-oblast/khimki/index.html \
                blog/klopy-v-kvartire/index.html \
                sluzhba-dezinsekcii/index.html \
                rajony/maryino/index.html; do
                if [ ! -f "/usr/share/nginx/html/$f" ]; then
                  echo "MISSING: $f"; FAIL=1
                else
                  echo "OK: $f"
                fi
              done
              if [ "$SSG_COUNT" -lt 500 ]; then
                echo "FAIL: only $SSG_COUNT pages"; FAIL=1
              fi
              [ $FAIL -eq 1 ] && exit 1
              echo "All checks passed"
            '
          echo "=== smoke check done $(date -u) ==="

      - name: Push image to Docker Hub
        run: |
          echo "=== push start $(date -u) ==="
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "=== push done $(date -u) ==="

      - name: Image digest
        if: always()
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ github.sha }} || true
