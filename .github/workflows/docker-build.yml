name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  IMAGE_NAME: thegusev/sanit-solutions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: DIAG - Install deps on runner
        run: timeout 10m npm ci --legacy-peer-deps

      - name: DIAG - Run build on runner
        run: timeout 20m npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        id: push-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke check SSG coverage
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cat > /tmp/smoke_check.sh << 'SMOKE_EOF'
          #!/bin/sh
          set -e
          echo "=== SSG Artifact Verification ==="
          SSG_COUNT=$(find /usr/share/nginx/html -name "index.html" | wc -l)
          echo "Total pages: $SSG_COUNT"
          FAIL=0
          for f in \
            uslugi/dezinsekciya/klopy/index.html \
            uslugi/dezinsekciya/blohi/index.html \
            uslugi/deratizaciya/krysy/index.html \
            uslugi/dezinfekciya/kvartir/index.html \
            rajony/arbat/index.html \
            moscow-oblast/khimki/index.html \
            blog/klopy-v-kvartire/index.html \
            sluzhba-dezinsekcii/index.html \
            rajony/maryino/index.html; do
            if [ ! -f "/usr/share/nginx/html/$f" ]; then
              echo "MISSING: $f"
              FAIL=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$SSG_COUNT" -lt 500 ]; then
            echo "FAIL: only $SSG_COUNT pages"
            FAIL=1
          fi
          [ $FAIL -eq 1 ] && exit 1
          echo "All checks passed"
          SMOKE_EOF
          chmod +x /tmp/smoke_check.sh
          docker run --rm \
            -v /tmp/smoke_check.sh:/tmp/smoke_check.sh \
            --entrypoint sh \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            /tmp/smoke_check.sh

      - name: Image digest
        run: echo "Pushed ${{ steps.push-image.outputs.digest }}"
