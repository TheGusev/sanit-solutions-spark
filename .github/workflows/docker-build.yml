name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  IMAGE_NAME: thegusev/sanit-solutions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "=== npm ci start $(date -u) ==="
          npm ci --legacy-peer-deps --no-audit --no-fund
          echo "=== npm ci done $(date -u) ==="

      - name: Build SSG (on runner, NOT inside Docker)
        run: |
          echo "=== npm run build start $(date -u) ==="
          export NODE_OPTIONS=--max-old-space-size=4096

          # Run in background so we can detect when SSG is done
          # even if the Node.js process hangs after.
          npm run build &
          BUILD_PID=$!
          echo "Build PID: $BUILD_PID"

          # Wait for SSG to complete by polling for the marker file
          # vite-plugin-ssg writes files to dist/ and prints 'SSG prerendering complete!'
          ELAPSED=0
          MAX_WAIT=600
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Check if build process has exited cleanly (exit 0)
            if ! kill -0 $BUILD_PID 2>/dev/null; then
              wait $BUILD_PID
              BEXIT=$?
              echo "=== Build process exited with code $BEXIT $(date -u) ==="
              break
            fi
            # Check if dist/ has enough HTML files (SSG done writing)
            COUNT=$(find dist -name "index.html" 2>/dev/null | wc -l)
            if [ "$COUNT" -ge 500 ]; then
              echo "=== SSG complete: $COUNT pages detected at ${ELAPSED}s, killing hung process ==="
              kill $BUILD_PID 2>/dev/null || true
              sleep 2
              break
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          SSG_COUNT=$(find dist -name "index.html" 2>/dev/null | wc -l)
          echo "=== Final SSG count: $SSG_COUNT pages ==="
          du -sh dist 2>/dev/null || echo "dist/ not found"

          if [ "$SSG_COUNT" -lt 500 ]; then
            echo "FATAL: only $SSG_COUNT pages generated (threshold: 500)"
            exit 1
          fi
          echo "=== SSG OK $(date -u) ==="

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (COPY dist only, no npm build inside)
        run: |
          echo "=== docker build start $(date -u) ==="
          DOCKER_BUILDKIT=0 docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          echo "=== docker build done $(date -u) ==="
          docker images ${{ env.IMAGE_NAME }}

      - name: Smoke check SSG coverage
        run: |
          echo "=== smoke check start $(date -u) ==="
          docker run --rm \
            --entrypoint sh \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -c '
              set -e
              SSG_COUNT=$(find /usr/share/nginx/html -name "index.html" | wc -l)
              echo "Pages in image: $SSG_COUNT"
              FAIL=0
              for f in \
                uslugi/dezinsekciya/klopy/index.html \
                uslugi/dezinsekciya/blohi/index.html \
                uslugi/deratizaciya/krysy/index.html \
                uslugi/dezinfekciya/kvartir/index.html \
                rajony/arbat/index.html \
                moscow-oblast/khimki/index.html \
                blog/klopy-v-kvartire/index.html \
                sluzhba-dezinsekcii/index.html \
                rajony/maryino/index.html; do
                if [ ! -f "/usr/share/nginx/html/$f" ]; then
                  echo "MISSING: $f"; FAIL=1
                else
                  echo "OK: $f"
                fi
              done
              if [ $FAIL -eq 1 ]; then
                echo "--- DEBUG: contents of rajony/ (first 30) ---"
                ls -la /usr/share/nginx/html/rajony 2>/dev/null | head -30 || echo "rajony/ directory does not exist"
                echo "--- DEBUG: contents of moscow-oblast/ (first 30) ---"
                ls -la /usr/share/nginx/html/moscow-oblast 2>/dev/null | head -30 || echo "moscow-oblast/ directory does not exist"
                echo "--- DEBUG: top-level dist contents ---"
                ls -la /usr/share/nginx/html | head -40
                exit 1
              fi
              echo "All checks passed"
            '
          echo "=== smoke check done $(date -u) ==="

      - name: Push image to Docker Hub
        run: |
          echo "=== push start $(date -u) ==="
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "=== push done $(date -u) ==="

      - name: Image digest
        if: always()
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ github.sha }} 2>/dev/null || true
