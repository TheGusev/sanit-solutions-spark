name: Daily IndexNow Submission

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Send IndexNow batch
        run: node scripts/send-indexnow-stateless.mjs
