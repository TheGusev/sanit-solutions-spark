server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 🚀 Gzip сжатие (улучшенная версия)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;  # Уровень сжатия (1-9, рекомендуется 6)
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript
        application/json 
        application/javascript 
        application/xml+rss 
        application/rss+xml 
        application/atom+xml 
        image/svg+xml 
        application/x-font-ttf 
        application/x-font-opentype 
        application/vnd.ms-fontobject;

    # 🚀 Brotli сжатие (если доступно)
    # Раскомментируйте если в nginx установлен модуль brotli
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # 🔒 Безопасность headers — полный набор для 100/100 в OwnDev
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ========================================
    # Статические файлы — отдаём напрямую
    # ========================================
    
    location = /robots.txt { 
        add_header Content-Type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    
    location = /sitemap.xml { 
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }
    
    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location = /og-image.jpg {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
    
    location ^~ /.well-known/ { }

    # ========================================
    # 410 Gone — старые WordPress URL
    # ========================================
    
    location ^~ /2022/ { return 410; }
    location ^~ /wp-admin/ { return 410; }
    location ^~ /wp-content/ { return 410; }
    location ^~ /wp-includes/ { return 410; }
    location = /wp-login.php { return 410; }
    location = /xmlrpc.php { return 410; }
    location ^~ /feed/ { return 410; }

    # ========================================
    # 301 — Anti-cannibalization redirects
    # Object+Geo leaks → object hub (no geo under /uslugi/)
    # ========================================
    
    location ~ ^/uslugi/dezinsekciya/ofisov/.+$ { return 301 /uslugi/dezinsekciya/ofisov/; }
    location ~ ^/uslugi/dezinfekciya/ofisov/.+$ { return 301 /uslugi/dezinfekciya/ofisov/; }
    location ~ ^/uslugi/dezinsekciya/hostelov/.+$ { return 301 /uslugi/dezinsekciya/hostela/; }
    location ~ ^/uslugi/dezinfekciya/hostelov/.+$ { return 301 /uslugi/dezinfekciya/hostela/; }
    location ~ ^/uslugi/kroty(/.*)?$ { return 301 /uslugi/deratizaciya/kroty/; }
    location ~ ^/uslugi/borba-s-krotami/kroty(/.*)?$ { return 301 /uslugi/deratizaciya/kroty/; }

    # ========================================
    # 301 — /rajony/{districtSlug}/ → districts hub
    # /rajony/:slug serves NeighborhoodPage; districts (cao/sao/...) live elsewhere
    # ========================================
    location = /rajony/cao/    { return 301 /uslugi/dezinfekciya-cao/; }
    location = /rajony/sao/    { return 301 /uslugi/dezinfekciya-sao/; }
    location = /rajony/svao/   { return 301 /uslugi/dezinfekciya-svao/; }
    location = /rajony/vao/    { return 301 /uslugi/dezinfekciya-vao/; }
    location = /rajony/yuvao/  { return 301 /uslugi/dezinfekciya-yuvao/; }
    location = /rajony/yao/    { return 301 /uslugi/dezinfekciya-yao/; }
    location = /rajony/yzao/   { return 301 /uslugi/dezinfekciya-yzao/; }
    location = /rajony/zao/    { return 301 /uslugi/dezinfekciya-zao/; }
    location = /rajony/szao/   { return 301 /uslugi/dezinfekciya-szao/; }
    location = /rajony/nao/    { return 301 /uslugi/po-okrugam-moskvy/; }
    location = /rajony/tao/    { return 301 /uslugi/po-okrugam-moskvy/; }
    location = /rajony/zelao/  { return 301 /uslugi/po-okrugam-moskvy/; }

    # ========================================
    # X-Robots-Tag: noindex для excluded pages (защита от SPA fallback override)
    # ========================================
    location = /uslugi/sertifikaciya/ {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/index.html =404;
    }

    # ========================================
    # 404 — попытки взлома WordPress
    # ========================================
    
    location ^~ /wp-json/ { return 404; }
    location = /wp-cron.php { return 404; }

    # ========================================
    # SPA Fallback только для админки (закрыта от индексации)
    # ========================================
    
    location ^~ /admin/ {
        try_files $uri $uri/ /admin.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ========================================
    # 301 Trailing slash redirect для SEO
    # ========================================
    
    rewrite ^(/uslugi/.+[^/])$ $1/ permanent;
    rewrite ^(/rajony/.+[^/])$ $1/ permanent;
    rewrite ^(/moscow-oblast/.+[^/])$ $1/ permanent;
    rewrite ^(/blog/.+[^/])$ $1/ permanent;
    rewrite ^(/contacts)$ $1/ permanent;
    rewrite ^(/privacy)$ $1/ permanent;

    # ========================================
    # Статические HTML (блог, услуги, контакты, privacy, районы, МО)
    # Эти правила ищут пререндеренные файлы
    # ========================================
    
    location ~ ^/blog/[^/]+/$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /blog/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    # 3-сегментные URL услуг (НЧ: /uslugi/dezinsekciya/tarakany/arbat/)
    location ~ ^/uslugi/[^/]+/[^/]+/[^/]+/$ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    # 2-сегментные URL услуг (/uslugi/dezinsekciya/tarakany/)
    location ~ ^/uslugi/[^/]+/[^/]+/$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location ~ ^/uslugi/[^/]+/$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location ~ ^/uslugi/dezinfekciya-[a-z]+/$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /uslugi/po-okrugam-moskvy/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    # Районы Москвы (/rajony/arbat/)
    location ~ ^/rajony/[^/]+/$ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /rajony/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    # Московская область (/moscow-oblast/khimki/dezinsekciya/)
    location ~ ^/moscow-oblast/[^/]+/[^/]+/$ {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location ~ ^/moscow-oblast/[^/]+/$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /moscow-oblast/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /contacts/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    
    location = /privacy/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # ========================================
    # 🚀 Статические ассеты (JS, CSS, images) — ДОЛГИЙ кеш + Gzip
    # ========================================

    location = /sw.js.map {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;  # Ищет .gz файлы если есть
        try_files $uri $uri.gz =404;
    }
    
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ========================================
    # Публичные маршруты: ищем реальный файл, иначе 404
    # Это КРИТИЧНО для SEO — не отдаём 200 на мусорных URL!
    # ========================================
    
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=3600";
    }

    # ========================================
    # Кастомные страницы ошибок
    # ========================================
    
    error_page 404 /404.html;
    error_page 410 /410.html;
    
    location = /404.html {
        internal;
    }
    
    location = /410.html {
        internal;
    }
    location = /sw.js {
        root /usr/share/nginx/html;
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
location /api/push/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $push_upstream http://push-server:3001;
        proxy_pass $push_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}

